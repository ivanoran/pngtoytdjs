<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG to DDS to YTD Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .upload-area {
            border: 3px dashed #00d9ff;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 217, 255, 0.05);
        }
        
        .upload-area:hover, .upload-area.dragover {
            background: rgba(0, 217, 255, 0.15);
            border-color: #00ff88;
        }
        
        .upload-area p {
            margin-bottom: 15px;
            color: #ccc;
        }
        
        #fileInput {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .preview-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            min-width: 200px;
        }
        
        .preview-box img {
            max-width: 180px;
            max-height: 180px;
            border-radius: 5px;
            background: #000;
        }
        
        .preview-box h3 {
            margin: 10px 0 5px;
            color: #00d9ff;
            font-size: 14px;
        }
        
        .preview-box p {
            font-size: 12px;
            color: #aaa;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .status.success {
            display: block;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        
        .status.error {
            display: block;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        
        .status.processing {
            display: block;
            background: rgba(0, 217, 255, 0.2);
            border: 1px solid #00d9ff;
            color: #00d9ff;
        }
        
        .info-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 20px;
        }
        
        .file-name {
            word-break: break-all;
            font-size: 12px;
            color: #00ff88;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PNG → DDS → YTD Converter</h1>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <p>📁 Drag & Drop PNG file here or click to browse</p>
                <button class="btn" onclick="document.getElementById('fileInput').click()">Select PNG File</button>
                <input type="file" id="fileInput" accept=".png,image/png">
            </div>
            
            <div id="fileName" class="file-name"></div>
            
            <div class="preview-container" id="previewContainer" style="display: none;">
                <div class="preview-box">
                    <img id="originalPreview" alt="Original PNG">
                    <h3>Original PNG</h3>
                    <p id="pngInfo"></p>
                </div>
                <div class="preview-box">
                    <img id="ddsPreview" alt="DDS Preview">
                    <h3>DDS (DXT5)</h3>
                    <p id="ddsInfo"></p>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" id="convertBtn" disabled onclick="startConversion()">
                    🚀 Convert PNG → DDS → YTD
                </button>
            </div>
            
            <div class="status" id="status"></div>
            
            <p class="info-text">
                This tool converts PNG images to DDS (DXT5 compressed) format, then packages them into a YTD (Texture Dictionary) file for GTA V.
            </p>
        </div>
    </div>

    <script src="png-to-dds.js"></script>
    <script src="dds-to-ytd.js"></script>
    <script src="app.js"></script>
</body>
</html>
